[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsecnet"
version = "0.1.0"
description = "Quantum network security analysis and threat assessment platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "QSecNet Contributors" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "networkx>=3.4,<4.0",
  "qiskit>=1.2,<2.0",
  "qiskit-aer>=0.15,<1.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
ibm = ["qiskit-ibm-runtime>=0.33,<1.0"]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "ruff>=0.8,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
